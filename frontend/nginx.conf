server {
    listen 80;
    root /usr/share/nginx/html;

    # profile pictures go up to 2 MB (nginx's default limit is 1 MB)
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # the video is streamed while it downloads: no buffering, and a long wait for the next bytes is normal
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
