services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hypertube
      POSTGRES_DB: hypertube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing from .env, run make up to create it}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypertube"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - ./data/jackett:/config
    ports:
      - "127.0.0.1:9117:9117"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hypertube:${POSTGRES_PASSWORD}@db:5432/hypertube
      JACKETT_URL: http://jackett:9117
      JACKETT_INDEXER: ${JACKETT_INDEXER:-all}
      JACKETT_EXTRA_INDEXERS: ${JACKETT_EXTRA_INDEXERS:-}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
    volumes:
      # the backend reads Jackett's API key from here when JACKETT_API_KEY is empty
      - ./data/jackett:/jackett-config:ro
      - downloads:/srv/data/downloads  # the movies downloaded by the torrent engine
    ports:
      - "127.0.0.1:8000:8000"
      # BitTorrent needs to be reachable from outside to find and serve peers
      - "6881:6881"
      - "6881:6881/udp"
    depends_on:
      db:
        condition: service_healthy
      jackett:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"  # nobody logs in: only this machine may open it
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  downloads:
